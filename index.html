<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WebAR Video Player</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

  <script>
    window.addEventListener('click', function () {
      const video = document.querySelector('#ar-video');
      if (video) {
        video.play();
      }
    });
  </script>

  <a-scene embedded arjs="debugUIEnabled: false; sourceType: webcam;">
    <a-assets>
      <video id="ar-video" src="asset.mp4" preload="auto" response-type="arraybuffer" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
    </a-assets>

    <a-marker preset="hiro">
      <a-video src="#ar-video" width="4" height="2.25" position="0 0 0" rotation="-90 0 0"></a-video>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
